# Kubernetes Deployment Configuration

apiVersion: v1
kind: Namespace
metadata:
  name: spring-course

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-course-config
  namespace: spring-course
data:
  SPRING_PROFILES_ACTIVE: "production"
  DATABASE_URL: "jdbc:postgresql://postgres-service:5432/springcourse"
  DATABASE_USERNAME: "postgres"

---
apiVersion: v1
kind: Secret
metadata:
  name: spring-course-secrets
  namespace: spring-course
type: Opaque
stringData:
  DATABASE_PASSWORD: "changeme"  # Alterar em produção!
  ADMIN_PASSWORD: "changeme"     # Alterar em produção!

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: spring-course
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: spring-course
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: springcourse
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: spring-course-config
              key: DATABASE_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spring-course-secrets
              key: DATABASE_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: spring-course
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-course
  namespace: spring-course
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-course
  template:
    metadata:
      labels:
        app: spring-course
    spec:
      containers:
      - name: spring-course
        image: ghcr.io/dalmosantos/java-spring-boot:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: spring-course-config
              key: SPRING_PROFILES_ACTIVE
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: spring-course-config
              key: DATABASE_URL
        - name: DATABASE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: spring-course-config
              key: DATABASE_USERNAME
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spring-course-secrets
              key: DATABASE_PASSWORD
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spring-course-secrets
              key: ADMIN_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: spring-course-service
  namespace: spring-course
spec:
  selector:
    app: spring-course
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spring-course-hpa
  namespace: spring-course
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spring-course
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
