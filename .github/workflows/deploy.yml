name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set environment variables
      run: |
        echo "DEPLOY_ENV=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "IMAGE_TAG=${{ inputs.version }}" >> $GITHUB_ENV
    
    # Exemplo: Deploy para servidor via SSH
    - name: Deploy to Server via SSH
      if: false  # Ative isso quando configurar seu servidor
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        script: |
          cd /opt/spring-course
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
          docker-compose down
          docker-compose up -d
          docker system prune -f
    
    # Exemplo: Deploy para Kubernetes
    - name: Deploy to Kubernetes
      if: false  # Ative isso quando configurar Kubernetes
      run: |
        echo "Deploying to Kubernetes cluster..."
        # kubectl set image deployment/spring-course spring-course=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
        # kubectl rollout status deployment/spring-course
    
    # Exemplo: Deploy para Azure App Service
    - name: Deploy to Azure App Service
      if: false  # Ative isso quando configurar Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_APP_NAME }}
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
    
    # Exemplo: Deploy para AWS ECS
    - name: Deploy to AWS ECS
      if: false  # Ative isso quando configurar AWS
      run: |
        echo "Deploying to AWS ECS..."
        # aws ecs update-service --cluster your-cluster --service your-service --force-new-deployment
    
    - name: Deployment Summary
      run: |
        echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
    
    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to ${{ inputs.environment }} completed successfully"
        else
          echo "❌ Deployment to ${{ inputs.environment }} failed"
        fi

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: false  # Ative isso quando configurar o endpoint
    
    steps:
    - name: Wait for deployment
      run: sleep 30
    
    - name: Check application health
      run: |
        HEALTH_URL="${{ secrets.APP_URL }}/actuator/health"
        echo "Checking health at: $HEALTH_URL"
        
        for i in {1..10}; do
          response=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || echo "000")
          if [ "$response" == "200" ]; then
            echo "✅ Application is healthy!"
            exit 0
          fi
          echo "⏳ Waiting for application to be ready... (attempt $i/10)"
          sleep 10
        done
        
        echo "❌ Health check failed"
        exit 1
